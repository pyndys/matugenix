name: Update sources
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [matugen-themes, dux, noctalia, noctalia-community]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: experimental-features = nix-command flakes
      - run: bash .github/update-sources.sh ${{ matrix.source }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-${{ matrix.source }}
          commit-message: "chore: bump ${{ matrix.source }}"
          title: "chore: bump ${{ matrix.source }}"
          body: "Autoupdate `${{ matrix.source }}`."
